<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
<template id="__bundler_thumbnail" data-bg-color="#faf7f0">
  <svg viewBox="0 0 1200 800" xmlns="http://www.w3.org/2000/svg">
    <rect width="1200" height="800" fill="#faf7f0"/>
    <circle cx="380" cy="400" r="110" fill="#c8873a"/>
    <g stroke="#c8873a" stroke-width="14" stroke-linecap="round">
      <line x1="380" y1="210" x2="380" y2="150"/>
      <line x1="380" y1="590" x2="380" y2="650"/>
      <line x1="190" y1="400" x2="130" y2="400"/>
      <line x1="514" y1="266" x2="556" y2="224"/>
      <line x1="514" y1="534" x2="556" y2="576"/>
      <line x1="246" y1="266" x2="204" y2="224"/>
      <line x1="246" y1="534" x2="204" y2="576"/>
    </g>
    <path d="M 640 620 Q 790 180 940 620" fill="none" stroke="#3d6e94" stroke-width="18" stroke-linecap="round"/>
    <line x1="600" y1="620" x2="1000" y2="620" stroke="#2b2620" stroke-width="10" stroke-linecap="round"/>
  </svg>
</template>
</head>
<body>
<x-dc>
<helmet>
  <meta name="design_doc_mode" content="canvas">
  <style>
    body { margin: 0; background: #111; }
    a { color: #3d6e94; }
    a:hover { color: #2f5776; }
  </style>
</helmet>
<div style="position:relative; width:100%; height:100vh; background:#0a0a0a;">
  <x-import component-from-global-scope="Stage" from="./animations.jsx" width="1920" height="1560" duration="36.5" background="#faf7f0" loop="true" autoplay="true" hint-size="100%,100%">
  <x-import component-from-global-scope="InsolationScene" from="./insolation-scene.jsx" show-toa-curve="{{ showToaCurve }}" show-orbit-view="{{ showOrbitView }}" show-geometry="{{ showGeometry }}" exaggerate-orbit="{{ exaggerateOrbit }}" day-cycle-speed="{{ dayCycleSpeed }}" show-fig211="{{ showFig211 }}" show-equations="{{ showEquations }}" scenario="{{ scenario }}" hint-size="100%,100%"></x-import>
  </x-import>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{
  &quot;showToaCurve&quot;: {&quot;editor&quot;: &quot;boolean&quot;, &quot;default&quot;: true, &quot;tsType&quot;: &quot;boolean&quot;, &quot;section&quot;: &quot;TOA curve&quot;},
  &quot;showOrbitView&quot;: {&quot;editor&quot;: &quot;boolean&quot;, &quot;default&quot;: false, &quot;tsType&quot;: &quot;boolean&quot;, &quot;section&quot;: &quot;Orbit view&quot;},
  &quot;showGeometry&quot;: {&quot;editor&quot;: &quot;boolean&quot;, &quot;default&quot;: true, &quot;tsType&quot;: &quot;boolean&quot;, &quot;section&quot;: &quot;Geometry view&quot;},
  &quot;exaggerateOrbit&quot;: {&quot;editor&quot;: &quot;boolean&quot;, &quot;default&quot;: false, &quot;tsType&quot;: &quot;boolean&quot;, &quot;section&quot;: &quot;Orbit view&quot;},
  &quot;dayCycleSpeed&quot;: {&quot;editor&quot;: &quot;range&quot;, &quot;default&quot;: 4, &quot;min&quot;: 1, &quot;max&quot;: 10, &quot;step&quot;: 0.5, &quot;unit&quot;: &quot;s&quot;, &quot;tsType&quot;: &quot;number&quot;, &quot;section&quot;: &quot;Daily curve&quot;},
  &quot;showFig211&quot;: {&quot;editor&quot;: &quot;boolean&quot;, &quot;default&quot;: false, &quot;tsType&quot;: &quot;boolean&quot;, &quot;section&quot;: &quot;Fig. 2.11 heatmap&quot;},
  &quot;showEquations&quot;: {&quot;editor&quot;: &quot;boolean&quot;, &quot;default&quot;: true, &quot;tsType&quot;: &quot;boolean&quot;, &quot;section&quot;: &quot;Equations&quot;},
  &quot;scenario&quot;: {&quot;editor&quot;: &quot;select&quot;, &quot;default&quot;: "desert", &quot;options&quot;: ["desert","oasis","snow","crop","forest","urban"], "tsType": "string", "section": "Scenario"}
}">
class Component extends DCLogic {
  renderVals() {
    return {
      showToaCurve: this.props.showToaCurve ?? true,
      showOrbitView: this.props.showOrbitView ?? false,
      showGeometry: this.props.showGeometry ?? true,
      exaggerateOrbit: this.props.exaggerateOrbit ?? false,
      dayCycleSpeed: this.props.dayCycleSpeed ?? 4,
      showFig211: this.props.showFig211 ?? false,
      showEquations: this.props.showEquations ?? true,
      scenario: this.props.scenario ?? 'desert',
    };
  }
}
</script>
</body>
</html>
