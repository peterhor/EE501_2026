<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<script src="../../assets/release.js"></script>
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<template id="__bundler_thumbnail">
  <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
    <rect width="200" height="200" fill="#faf7f0"/>
    <circle cx="100" cy="100" r="70" fill="none" stroke="#2b2620" stroke-width="4"/>
    <circle cx="100" cy="100" r="8" fill="#c8873a"/>
    <circle cx="170" cy="100" r="10" fill="#3d6e94"/>
  </svg>
</template>
<helmet>
  <meta name="design_doc_mode" content="canvas">
  <meta name="ext-resource-dependency" content="./animations.jsx">
  <meta name="ext-resource-dependency" content="./insolation-scene-v2.jsx">
  <script src="./earth-rotation-gif.js"></script>
  <style>
    body { margin: 0; background: #111; }
    a { color: #3d6e94; }
    a:hover { color: #2f5776; }
  </style>
</helmet>
<div style="position:relative; width:100%; height:100vh; background:#0a0a0a;">
  <x-import component-from-global-scope="Stage" from="./animations.jsx" width="1920" height="2420" duration="36.5" background="#faf7f0" loop="true" autoplay="true" hint-size="100%,100%">

  <x-import component-from-global-scope="InsolationScene" from="./insolation-scene-v2.jsx" show-orbit-view="{{ showOrbitView }}" exaggerate-orbit="{{ exaggerateOrbit }}" day-cycle-speed="{{ dayCycleSpeed }}" show-sky-path="{{ showSkyPath }}" show-fig211="{{ showFig211 }}" show-annual-total="{{ showAnnualTotal }}" show-equations="{{ showEquations }}" hint-size="100%,100%"</x-import></x-import>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{
  &quot;showOrbitView&quot;: {&quot;editor&quot;: &quot;boolean&quot;, &quot;default&quot;: true, &quot;tsType&quot;: &quot;boolean&quot;, &quot;section&quot;: &quot;Orbit view&quot;},
  &quot;exaggerateOrbit&quot;: {&quot;editor&quot;: &quot;boolean&quot;, &quot;default&quot;: false, &quot;tsType&quot;: &quot;boolean&quot;, &quot;section&quot;: &quot;Orbit view&quot;},
  &quot;showSkyPath&quot;: {&quot;editor&quot;: &quot;boolean&quot;, &quot;default&quot;: true, &quot;tsType&quot;: &quot;boolean&quot;, &quot;section&quot;: &quot;Sky view&quot;},
  &quot;dayCycleSpeed&quot;: {&quot;editor&quot;: &quot;range&quot;, &quot;default&quot;: 4, &quot;min&quot;: 1, &quot;max&quot;: 10, &quot;step&quot;: 0.5, &quot;unit&quot;: &quot;s&quot;, &quot;tsType&quot;: &quot;number&quot;, &quot;section&quot;: &quot;Daily curve&quot;},
  &quot;showFig211&quot;: {&quot;editor&quot;: &quot;boolean&quot;, &quot;default&quot;: true, &quot;tsType&quot;: &quot;boolean&quot;, &quot;section&quot;: &quot;Latitude summaries&quot;},
  &quot;showAnnualTotal&quot;: {&quot;editor&quot;: &quot;boolean&quot;, &quot;default&quot;: true, &quot;tsType&quot;: &quot;boolean&quot;, &quot;section&quot;: &quot;Latitude summaries&quot;},
  &quot;showEquations&quot;: {&quot;editor&quot;: &quot;boolean&quot;, &quot;default&quot;: true, &quot;tsType&quot;: &quot;boolean&quot;, &quot;section&quot;: &quot;Latitude summaries&quot;}
}">class Component extends DCLogic {
  renderVals() {
    return {
      showOrbitView: this.props.showOrbitView ?? true,
      exaggerateOrbit: this.props.exaggerateOrbit ?? false,
      dayCycleSpeed: this.props.dayCycleSpeed ?? 4,
      showFig211: this.props.showFig211 ?? true,
      showAnnualTotal: this.props.showAnnualTotal ?? true,
      showEquations: this.props.showEquations ?? true,
      showSkyPath: this.props.showSkyPath ?? true,
    };
  }
}</script>
</body>
</html>
