<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<script src="assets/release.js"></script>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>EE501 — not open yet</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #faf9f5;
    --fg: #1b1b1b;
    --muted: #6b6b6b;
    --card-bg: #ffffff;
    --card-border: #e5e2da;
    --accent: #b45309;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #15171a;
      --fg: #ececec;
      --muted: #9a9a9a;
      --card-bg: #1d2024;
      --card-border: #2c2f34;
      --accent: #e0a458;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: var(--bg);
    color: var(--fg);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 2rem 1rem;
  }
  main {
    max-width: 520px;
    width: 100%;
    background: var(--card-bg);
    border: 1px solid var(--card-border);
    border-radius: 14px;
    padding: 2rem 1.9rem 1.7rem;
  }
  .lock {
    display: flex;
    align-items: center;
    gap: 0.55rem;
    color: var(--accent);
    font-size: 0.8rem;
    font-weight: 700;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    margin-bottom: 0.9rem;
  }
  h1 { font-size: 1.25rem; margin: 0 0 0.5rem; line-height: 1.35; }
  p { color: var(--muted); font-size: 0.92rem; line-height: 1.55; margin: 0 0 1rem; }
  p.opens { color: var(--fg); font-size: 1rem; font-weight: 600; margin-bottom: 1.3rem; }
  a.back {
    display: inline-block;
    padding: 0.55rem 1.1rem;
    border-radius: 8px;
    background: var(--accent);
    color: #fff;
    text-decoration: none;
    font-size: 0.9rem;
    font-weight: 600;
  }
  a.back:hover { opacity: 0.9; }
</style>
</head>
<body>
<main>
  <div class="lock">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" aria-hidden="true">
      <rect x="4" y="10.5" width="16" height="11" rx="2"></rect>
      <path d="M8 10.5V7a4 4 0 0 1 8 0v3.5"></path>
    </svg>
    Not open yet
  </div>
  <h1 id="unit">This part of the course material is not open yet.</h1>
  <p>Material is released as the course moves through it, so that the questions in
  the lecture are still questions when you get to them.</p>
  <p class="opens" id="opens"></p>
  <a class="back" href="./">Back to the course page</a>
</main>
<script>
  (function () {
    var params = new URLSearchParams(location.search);
    var unit = params.get('u');
    var R = window.EE501Release;
    if (!R || !unit || !R.units[unit]) return;
    document.getElementById('unit').textContent = R.unitName(unit) + ' is not open yet.';
    document.getElementById('opens').textContent = 'Opens ' + R.opensText(unit) + '.';
    document.title = 'EE501 — opens ' + R.opensText(unit);
  })();
</script>
</body>
</html>
